name: sdk

# Regenerate the SDKs from api/openapi.yaml.
#
# The spec is the source of truth and four languages are generated from it. The
# output is committed rather than built by each consumer, because a Python user
# should be able to install the package without a Java toolchain, and a Go user
# should be able to `go get` without a code generator — the point of publishing
# generated code is that the consumer does not reproduce it.
#
# That only holds while the committed code keeps up with the spec, which is what
# this workflow is for. On main it regenerates and commits the result, so editing
# the spec is the only step anyone has to take. On a pull request it regenerates
# and throws the result away: the question there is whether the new spec
# generates and compiles at all, and asking before the merge is cheaper than
# finding out afterwards — and a bot commit on someone else's branch is not a
# thing to do uninvited.
on:
  push:
    branches: ["main"]
  pull_request:
    paths:
      - "api/**"
      - "sdk/**"
      - "hack/generate-sdks.sh"
      - ".github/workflows/sdk.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  generate:
    name: generate
    runs-on: ubuntu-latest
    permissions:
      # The commit this job makes on main is pushed back to main, which the
      # default read-only token refuses.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Two toolchains, because the Go SDK is generated by oapi-codegen and the
      # other three by openapi-generator, which is a Java program.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The pinned generator jar, cached across runs: 30MB from Maven Central
      # that never changes for a given version.
      - uses: actions/cache@v4
        with:
          path: .cache
          key: openapi-generator-7.17.0

      - name: Generate every SDK
        run: ./hack/generate-sdks.sh

      # Generated code that does not compile is worse than no SDK, and each
      # language needs its own compiler to find out. These are the cheapest
      # check per language, not a test suite: that a client speaks this API
      # correctly is what the Go SDK's own tests cover, against a real server,
      # and the four are generated from one document.
      - name: The Go SDK builds
        run: go build ./sdk/...

      - name: The Go SDK imports nothing internal
        run: |
          set -euo pipefail
          # Go forbids an external module from importing internal/, which makes
          # the package useless to the person most likely to want it. The rule
          # is enforced by the compiler, but only when something outside the
          # module tries — this is that attempt, made cheaply.
          if go list -deps ./sdk/go | grep -q 'sandboxlab/internal/'; then
            echo "::error::sdk/go imports internal/, so no external module could use it"
            go list -deps ./sdk/go | grep 'sandboxlab/internal/'
            exit 1
          fi

      - name: The TypeScript SDK typechecks
        run: npx --yes --package typescript@5 tsc --noEmit -p sdk/typescript

      - name: The Python SDK parses
        run: python3 -m compileall -q sdk/python/sandboxlab

      # Maven rather than javac because the generated client depends on Jackson,
      # and the generated pom is what knows which version.
      - name: The Java SDK compiles
        run: mvn -q -B -f sdk/java/pom.xml compile

      # Regenerating is not required of the author. On a pull request this is
      # where a stale SDK is reported; on main the next step fixes it.
      - name: Report whether the committed SDK is current
        run: |
          if git diff --quiet -- sdk/; then
            echo "the committed SDK matches the spec"
          else
            echo "::notice::the committed SDK is behind the spec; main regenerates and commits it"
            git diff --stat -- sdk/ | tail -20
          fi

      # The point of the workflow. The whole content of this commit is files the
      # generator produced from the spec, so the safest way to survive a push
      # that lands mid-run is to take upstream's tree and regenerate from it,
      # rather than to rebase a change nobody wrote by hand.
      - name: Commit the regenerated SDK
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch --quiet origin "${GITHUB_REF_NAME}"
            # Discards nothing that is not regenerated three lines later.
            git reset --hard "origin/${GITHUB_REF_NAME}"
            ./hack/generate-sdks.sh
            git add sdk/
            if git diff --cached --quiet; then
              echo "the SDK already matches the spec; nothing to commit"
              exit 0
            fi
            git commit -q -m "Regenerate the SDK from api/openapi.yaml

          The spec is the source of truth; this is what it produces for Go,
          Python, TypeScript and Java. Generated by hack/generate-sdks.sh.

          [skip ci]"
            if git push --quiet origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "committed the regenerated SDK"
              exit 0
            fi
            echo "push attempt ${attempt} was rejected; regenerating on the new base"
            sleep 5
          done
          echo "::error::could not push the regenerated SDK"
          exit 1
