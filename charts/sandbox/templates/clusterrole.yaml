{{- if .Values.rbac.create -}}
{{/*
Cluster-scoped, and it has to be.

A sandbox is a namespace, so creating one is a cluster-scoped write — there is
no namespace you could grant "create namespaces in". Anything narrower than this
would mean the control plane could not do the one thing it exists to do, so the
grant is written out rather than pretended at with a Role.

It is a ClusterRole per resource rather than a wildcard, so what it can do is
readable: it manages namespaces that carry its own label, and everything inside
the ones it created.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "sandbox.fullname" . }}
  labels:
    {{- include "sandbox.labels" . | nindent 4 }}
rules:
  # The sandbox lifecycle itself. `delete` on namespaces is the one that matters
  # and the one worth reviewing: deleting a namespace reclaims everything in it,
  # which is the design and also the most destructive thing this can do.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create", "delete"]
  # A namespace has to be labelled for the control plane to recognise it, and
  # the expiry is an annotation on it — so updating namespaces is `renew`.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["update", "patch"]

  # Everything created inside a sandbox's namespace. These are namespaced
  # resources and the grant is cluster-wide, because which namespaces exist is
  # decided at runtime.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "delete", "update", "patch"]
  - apiGroups: [""]
    resources: ["services", "resourcequotas", "limitranges", "pods", "configmaps", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "delete", "update", "patch"]
  # Sandbox namespaces and the control plane's own are the same cluster, so the
  # grant is cluster-wide and includes the Secret holding the deployment's key.
  # Nothing here writes one: the key is made by the chart's install and read by
  # the process from its environment. The read is what makes it explicit.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
  # Reading a sandbox's output. `pods/log` is a separate resource from `pods`
  # and is easy to leave out, which shows up as `sandbox logs` failing on an
  # otherwise working deployment.
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # What a sandbox is using, for the console's Metrics panel. Resource usage is
  # served by metrics-server under its own API group, and `pods` there is a
  # different resource from core `pods` — the grant above does not cover it, and
  # without this rule reading usage is a 403 rather than an empty reading. A
  # cluster with no metrics-server simply answers 404 for the group, which the
  # control plane reports as usage being unavailable.
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
  # The events that explain a sandbox that is not working — an image pull that
  # failed, a probe that killed the container, a pod that was never scheduled.
  # Read-only: the control plane reports events, it never creates one.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  # Running a command inside a sandbox, which is what `sandbox exec` and the
  # file endpoints are built on. A subresource again, and separate from `pods`
  # for the same reason `pods/log` is — this is the one grant here that lets the
  # holder run arbitrary code in a sandbox, so it is written out rather than
  # implied by the `pods` rule above.
  #
  # `get` as well as `create`: the connection upgrade that carries the command
  # is negotiated with a GET before the POST begins.
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["get", "create"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "delete", "update", "patch"]

  {{- if .Values.istio.enabled }}
  # The console's own route, when the chart installs one.
  - apiGroups: ["networking.istio.io"]
    resources: ["virtualservices"]
    verbs: ["get", "list", "watch", "create", "delete", "update", "patch"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "sandbox.fullname" . }}
  labels:
    {{- include "sandbox.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "sandbox.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "sandbox.serviceAccountName" . }}
    namespace: {{ include "sandbox.namespace" . }}
{{- end }}
