apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sandbox.serviceAccountName" . }}
  namespace: {{ include "sandbox.namespace" . }}
  labels:
    {{- include "sandbox.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
  {{- with .Values.podAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
