{{- /* Evaluated before the gate below, because the gate is what would hide the
     mistake: with existingSecret set the file is skipped, so a check inside it
     would never run for exactly the case it is checking. */ -}}
{{- if and .Values.existingSecret .Values.apiKey -}}
{{- fail "existingSecret and apiKey are both set: the key comes from the Secret, so apiKey would be ignored — set one" -}}
{{- end -}}
{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sandbox.fullname" . }}-apikey
  namespace: {{ include "sandbox.namespace" . }}
  labels:
    {{- include "sandbox.labels" . | nindent 4 }}
  annotations:
    {{- /*
    Kept across upgrades, and deliberately so — the value in it is what clients
    were given, and `helm upgrade` should not invalidate them. The chart reads
    this Secret back through `lookup` rather than re-rendering a new key over
    it.
    */}}
    helm.sh/resource-policy: keep
type: Opaque
data:
  api-key: {{ include "sandbox.apiKey" . | b64enc | quote }}
{{- end }}
