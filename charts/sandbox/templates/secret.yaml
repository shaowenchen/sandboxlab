apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sandbox.fullname" . }}-apikey
  namespace: {{ include "sandbox.namespace" . }}
  labels:
    {{- include "sandbox.labels" . | nindent 4 }}
  annotations:
    {{- /*
    Kept across upgrades, and deliberately so — the value in it is what clients
    were given, and `helm upgrade` should not invalidate them. The chart reads
    this Secret back through `lookup` rather than re-rendering a new key over
    it.
    */}}
    helm.sh/resource-policy: keep
type: Opaque
data:
  api-key: {{ include "sandbox.apiKey" . | b64enc | quote }}
