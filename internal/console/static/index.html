<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sandboxes</title>
<!--
  One page, no build step, no external asset: it is served from inside the
  binary and every request it makes goes to the same /api/v1 the CLI uses.
-->
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --ink: #16181d; --muted: #6b7280;
    --line: #e3e5e9; --accent: #2f6feb; --accent-ink: #fff;
    --ok: #1a7f37; --warn: #9a6700; --bad: #b42318; --idle: #6b7280;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --panel: #171a21; --ink: #e6e8ec; --muted: #9aa2b1;
      --line: #262b35; --accent: #4c8dff; --accent-ink: #0b0d11;
      --ok: #3fb950; --warn: #d29922; --bad: #f85149; --idle: #8b93a1;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 14px 20px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .01em; }
  header .grow { flex: 1; }
  main { padding: 20px; max-width: 1180px; margin: 0 auto; }
  section { margin-bottom: 26px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em;
       color: var(--muted); margin: 0 0 10px; font-weight: 600; }

  .tiles { display: flex; gap: 10px; flex-wrap: wrap; }
  .tile {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 16px; min-width: 108px;
  }
  .tile b { display: block; font-size: 22px; font-weight: 650; line-height: 1.2; }
  .tile span { color: var(--muted); font-size: 12px; }

  .cards { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px; display: flex; flex-direction: column; gap: 8px;
  }
  .card h3 { margin: 0; font-size: 14px; font-weight: 600; }
  .card p { margin: 0; color: var(--muted); font-size: 13px; }
  .card .meta { font-family: var(--mono); font-size: 11.5px; color: var(--muted);
                word-break: break-all; }
  .card .foot { margin-top: auto; padding-top: 6px; }

  table { width: 100%; border-collapse: collapse; background: var(--panel);
          border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line);
           vertical-align: middle; }
  th { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em;
       color: var(--muted); font-weight: 600; background: transparent; }
  tr:last-child td { border-bottom: 0; }
  td.mono, .mono { font-family: var(--mono); font-size: 12.5px; }

  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px;
           font-size: 11.5px; font-weight: 600; border: 1px solid currentColor; }
  .s-Running { color: var(--ok); }
  .s-Pending { color: var(--warn); }
  .s-Failed  { color: var(--bad); }
  .s-Expired { color: var(--idle); }

  button, .btn {
    font: inherit; padding: 6px 12px; border-radius: 7px; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    text-decoration: none; display: inline-block;
  }
  button:hover, .btn:hover { border-color: var(--muted); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  button.primary:hover { filter: brightness(1.06); }
  button.danger { color: var(--bad); }
  button.small { padding: 3px 8px; font-size: 12.5px; }
  button[disabled] { opacity: .5; cursor: default; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .links { display: flex; gap: 8px; flex-wrap: wrap; }

  input, select {
    font: inherit; padding: 6px 10px; border-radius: 7px;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  }
  input:focus, select:focus, button:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px;
  }
  label { color: var(--muted); font-size: 12.5px; }

  dialog {
    border: 1px solid var(--line); border-radius: 12px; padding: 0;
    background: var(--panel); color: var(--ink); width: min(520px, 92vw);
  }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  dialog form { padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  dialog h3 { margin: 0; font-size: 15px; }
  dialog .field { display: flex; flex-direction: column; gap: 4px; }
  dialog .actions { display: flex; justify-content: flex-end; gap: 8px; padding-top: 4px; }

  pre {
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
    padding: 12px; overflow: auto; max-height: 46vh; margin: 0;
    font-family: var(--mono); font-size: 12.5px; white-space: pre-wrap; word-break: break-word;
  }
  #toast { position: fixed; right: 18px; bottom: 18px; display: flex;
           flex-direction: column; gap: 8px; z-index: 10; }
  #toast div {
    background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--accent);
    border-radius: 8px; padding: 10px 14px; box-shadow: 0 6px 20px rgba(0,0,0,.16);
    max-width: 44ch;
  }
  #toast div.err { border-left-color: var(--bad); }
  .empty { color: var(--muted); background: var(--panel); border: 1px dashed var(--line);
           border-radius: 10px; padding: 18px; text-align: center; }
  .muted { color: var(--muted); }
  .hidden { display: none !important; }
  /* The `hidden` attribute hides by way of the browser's own
     `[hidden] { display: none }`, which any author rule on the same element
     outranks — and `button { display: inline-block }` above is one. So the Sign
     out button, set to `hidden` until a key is accepted, was drawn from the
     start. Stated once here rather than repeated as a `[hidden]` rule beside
     every element that needs it. */
  [hidden] { display: none !important; }
  .scroll { overflow-x: auto; }

  /* ── sign in ─────────────────────────────────────────────────────────────
     The card is the whole page until a key is accepted, so it centres itself
     in the space below the header. While it is up everything else is hidden,
     including the header's refresh: a form with two places to type the same
     credential is two answers to "where do I enter it". */
  #signin {
    display: flex; align-items: center; justify-content: center;
    min-height: 64vh; padding: 24px 0;
  }
  .signin-card {
    width: 100%; max-width: 380px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px; padding: 26px;
  }
  /* The card opens on its one sentence and asks for one thing. It carries no
     mark of its own — the header above already says what this is — and no
     explanation of the two kinds of key: which one was typed is the API's
     answer to give, and the console shows it the moment there is one. */
  .signin-lead { margin: 0 0 16px; font-size: 15px; }
  .signin-form { display: flex; flex-direction: column; gap: 10px; }
  .signin-form input { width: 100%; padding: 9px 11px; }
  .signin-form button { padding: 9px 12px; }
  .signin-error {
    margin: 0 0 14px; font-size: 13px; color: var(--bad);
    background: color-mix(in srgb, var(--bad) 8%, transparent);
    border: 1px solid color-mix(in srgb, var(--bad) 40%, transparent);
    border-radius: 7px; padding: 9px 11px;
  }
  .signin-error[hidden] { display: none; }

  /* A field with its eye inside it. The input takes the room and the button
     rides the right edge, so a long key does not push the control off the row. */
  .key-field { position: relative; display: flex; }
  .key-field input { flex: 1; padding-right: 34px; }
  /* The eye. Quiet by default: it changes a preference about what is on screen,
     which is not what anyone opened the page to do. */
  .reveal {
    display: flex; align-items: center; justify-content: center;
    width: 28px; height: 28px; padding: 0;
    border-color: transparent; background: transparent; color: var(--muted);
  }
  .reveal:hover { color: var(--ink); background: var(--bg); }
  .reveal svg { width: 16px; height: 16px; display: block; }
  .key-field .reveal {
    position: absolute; top: 50%; right: 2px; transform: translateY(-50%);
  }
</style>
</head>
<body>
<header>
  <h1>Sandboxes</h1>
  <span class="grow"></span>
  <button id="refresh" title="Reload">Refresh</button>
  <button id="signout" hidden>Sign out</button>
</header>

<main>
  <!-- Sign in. Shown until a key is accepted, and the only thing on the page
       while it is: everything below is hidden, so there is no half-drawn
       console behind a credential prompt. -->
  <section id="signin">
    <div class="signin-card">
      <p class="signin-lead">Enter an API key to continue.</p>
      <p id="signin-error" class="signin-error" hidden></p>
      <form id="signin-form" class="signin-form" autocomplete="off">
        <div class="key-field">
          <input id="signin-key" type="password" placeholder="API key" autocomplete="off"
                 spellcheck="false" aria-label="API key">
          <button id="signin-reveal" class="reveal" type="button"></button>
        </div>
        <button class="primary" type="submit">Sign in</button>
      </form>
    </div>
  </section>

  <section id="overview" hidden>
    <h2>Overview</h2>
    <div class="tiles" id="tiles"></div>
  </section>

  <section id="catalogSection" hidden>
    <h2>Templates</h2>
    <div class="cards" id="catalog"></div>
  </section>

  <section id="sandboxSection" hidden>
    <h2>Sandboxes</h2>
    <div id="sandboxes"></div>
  </section>

</main>

<dialog id="createDialog">
  <form method="dialog" id="createForm">
    <h3>New sandbox</h3>
    <div class="field">
      <label for="cTemplate">Template</label>
      <select id="cTemplate"></select>
    </div>
    <div class="field">
      <label for="cName">Name <span class="muted">(optional)</span></label>
      <input id="cName" placeholder="left empty, one is generated" autocomplete="off">
    </div>
    <div class="field">
      <label for="cTTL">Lifetime <span class="muted">(optional, e.g. 90m or 2h)</span></label>
      <input id="cTTL" placeholder="the template's default" autocomplete="off">
    </div>
    <div class="actions">
      <button value="cancel">Cancel</button>
      <button class="primary" value="create">Create</button>
    </div>
  </form>
</dialog>



<dialog id="logsDialog">
  <form method="dialog">
    <h3 id="logsTitle">Logs</h3>
    <pre id="logsBody"></pre>
    <div class="actions"><button value="close">Close</button></div>
  </form>
</dialog>

<div id="toast"></div>

<script>
(function () {
  "use strict";

  // Everything this page calls lives under the deployment's own base path. It
  // is derived from the page's URL rather than configured, so the same file
  // works at "/" and at "/sandbox", and nothing has to be kept in step with
  // SANDBOX_BASE_PATH on the server.
  var API = location.pathname.replace(/\/+$/, "") + "/api/v1";

  var state = { key: "", catalog: [], sandboxes: [] };
  var $ = function (id) { return document.getElementById(id); };

  // ── plumbing ──────────────────────────────────────────────────────────────

  function toast(message, isError) {
    var el = document.createElement("div");
    if (isError) el.className = "err";
    el.textContent = message;
    $("toast").appendChild(el);
    setTimeout(function () { el.remove(); }, isError ? 7000 : 3500);
  }

  function api(path, options) {
    options = options || {};
    var headers = { "X-Sandbox-Key": state.key };
    if (options.body !== undefined) headers["Content-Type"] = "application/json";
    return fetch(API + path, {
      method: options.method || "GET",
      headers: headers,
      body: options.body === undefined ? undefined : JSON.stringify(options.body)
    }).then(function (res) {
      return res.text().then(function (text) {
        var data = null;
        try { data = text ? JSON.parse(text) : null; } catch (e) { /* not JSON */ }
        if (!res.ok) {
          var msg = (data && data.error) || text || res.statusText;
          var err = new Error(msg);
          err.status = res.status;
          throw err;
        }
        return data;
      });
    });
  }

  function text(tag, cls, content) {
    var el = document.createElement(tag);
    if (cls) el.className = cls;
    if (content !== undefined) el.textContent = content;
    return el;
  }

  function ttlText(sb) {
    if (!sb.expiresAt) return "no expiry";
    var left = new Date(sb.expiresAt).getTime() - Date.now();
    if (left <= 0) return "expired";
    var m = Math.floor(left / 60000);
    if (m < 60) return m + "m left";
    return Math.floor(m / 60) + "h " + (m % 60) + "m left";
  }
  // ── rendering ─────────────────────────────────────────────────────────────

  function renderOverview(ov) {
    var tiles = $("tiles");
    tiles.replaceChildren();

    var add = function (value, label) {
      var t = text("div", "tile");
      t.appendChild(text("b", null, String(value)));
      t.appendChild(text("span", null, label));
      tiles.appendChild(t);
    };
    add(ov.total, "sandboxes");
    Object.keys(ov.byState || {}).sort().forEach(function (s) { add(ov.byState[s], s.toLowerCase()); });
    add(ov.cluster ? "up" : "unreachable", "cluster");
    if (ov.maxSandboxes) add(ov.maxSandboxes, "limit");

    $("overview").hidden = false;
  }

  function renderCatalog() {
    var wrap = $("catalog");
    wrap.replaceChildren();
    state.catalog.forEach(function (t) {
      var card = text("div", "card");
      card.appendChild(text("h3", null, t.title || t.id));
      card.appendChild(text("p", null, t.description || ""));
      card.appendChild(text("div", "meta", t.image));

      var ports = (t.ports || []).map(function (p) { return p.name + " " + p.port; }).join("  ");
      if (ports) card.appendChild(text("div", "meta", ports));

      var foot = text("div", "foot");
      var btn = text("button", "primary", "Create");
      btn.onclick = function () { openCreate(t.id); };
      foot.appendChild(btn);
      card.appendChild(foot);
      wrap.appendChild(card);
    });
    $("catalogSection").hidden = false;
  }

  function renderSandboxes() {
    var wrap = $("sandboxes");
    wrap.replaceChildren();

    if (!state.sandboxes.length) {
      var empty = text("div", "empty");
      empty.appendChild(text("p", null, "No sandboxes yet."));
      empty.appendChild(text("p", "muted",
        "Create one from a template above; it is deleted when its lifetime runs out, or when you delete it."));
      wrap.appendChild(empty);
      $("sandboxSection").hidden = false;
      return;
    }

    var header = ["name", "template", "state", "lifetime"];
    header.push("addresses", "");

    var table = text("table");
    var thead = text("thead");
    var hr = text("tr");
    header.forEach(function (h) { hr.appendChild(text("th", null, h)); });
    thead.appendChild(hr);
    table.appendChild(thead);

    var tbody = text("tbody");
    state.sandboxes.forEach(function (sb) {
      var tr = text("tr");
      tr.appendChild(text("td", "mono", sb.id));
      tr.appendChild(text("td", null, sb.template));

      var stateTd = text("td");
      var badge = text("span", "badge s-" + sb.state, sb.state);
      if (sb.message) badge.title = sb.message;
      stateTd.appendChild(badge);
      tr.appendChild(stateTd);

      tr.appendChild(text("td", "muted", ttlText(sb)));

      var links = text("td");
      var box = text("div", "links");
      (sb.endpoints || []).forEach(function (ep) {
        if (!ep.url) return;
        var a = text("a", "btn small", ep.name);
        a.href = ep.url + "?key=" + encodeURIComponent(state.key);
        a.target = "_blank";
        a.rel = "noopener";
        box.appendChild(a);
      });
      if (!box.childNodes.length) box.appendChild(text("span", "muted", "—"));
      links.appendChild(box);
      tr.appendChild(links);

      var actions = text("td");
      var row = text("div", "row");
      var logs = text("button", "small", "Logs");
      logs.onclick = function () { showLogs(sb.id); };
      var renew = text("button", "small", "Renew");
      renew.onclick = function () { renewSandbox(sb.id); };
      var rm = text("button", "small danger", "Delete");
      rm.onclick = function () { removeSandbox(sb.id); };
      row.appendChild(logs);
      row.appendChild(renew);
      row.appendChild(rm);
      actions.appendChild(row);
      tr.appendChild(actions);

      tbody.appendChild(tr);
    });
    table.appendChild(tbody);

    var scroller = text("div", "scroll");
    scroller.appendChild(table);
    wrap.appendChild(scroller);

    $("sandboxSection").hidden = false;
  }



  // ── actions ───────────────────────────────────────────────────────────────

  // ── session ───────────────────────────────────────────────────────────────

  // The key is the whole credential; nothing else identifies a caller. It is
  // kept in localStorage so a reload does not ask again, which is the same
  // choice the CLI makes with its own config file — a credential you have to
  // paste back on every visit is one that ends up in a chat message.
  function saveKey(key) {
    try { localStorage.setItem("sandbox.key", key); } catch (e) { /* private mode */ }
  }

  function savedKey() {
    try { return localStorage.getItem("sandbox.key") || ""; } catch (e) { return ""; }
  }

  function clearKey() {
    try { localStorage.removeItem("sandbox.key"); } catch (e) { /* private mode */ }
  }

  function setSigninError(message) {
    var el = $("signin-error");
    el.textContent = message || "";
    el.hidden = !message;
  }

  // Show the console or the sign-in card, never both. One function because the
  // two must not disagree: a page showing the sign-in card over a drawn console
  // is how a stale key looks like a working session.
  function showSignedIn(signedIn) {
    $("signin").hidden = signedIn;
    $("signout").hidden = !signedIn;
    ["overview", "catalogSection", "sandboxSection"].forEach(function (id) {
      if (!signedIn) $(id).hidden = true;
    });
    if (!signedIn) {
      $("signin-key").value = "";
      $("signin-key").focus();
    }
  }

  function signOut() {
    clearKey();
    state.key = "";
    setSigninError("");
    showSignedIn(false);
  }

  // connect checks the key before anything is drawn from it, so a bad one is
  // answered on the form that asked rather than by an empty console.
  function connect(key) {
    setSigninError("");
    state.key = key;
    return refresh().then(function () {
      saveKey(key);
      showSignedIn(true);
      return true;
    }).catch(function (err) {
      // The key is dropped on failure: keeping one that did not work would make
      // the next load retry it and show the same error, behind a card that had
      // already been filled in from storage.
      clearKey();
      state.key = "";
      if (err.status === 401 || err.status === 403) {
        setSigninError("That key was not accepted. Check it and try again.");
      } else {
        setSigninError(err.message);
      }
      showSignedIn(false);
      return false;
    });
  }

  // refresh draws everything from the key the page is holding.
  //
  // There is no whoami in front of it. With one key and no roles, the question
  // it would ask — "whose key is this, and what may it do" — has one answer for
  // every caller, and a 401 from any of these calls says the only thing left to
  // say: the key is wrong. So signing in is this same call, and a rejected key
  // is answered where it was typed rather than by a second round trip.
  function refresh() {
    return Promise.all([
      api("/overview"),
      api("/catalog"),
      api("/sandboxes")
    ]).then(function (r) {
      renderOverview(r[0]);
      state.catalog = r[1].templates || [];
      state.sandboxes = r[2].sandboxes || [];
      renderCatalog();
      renderSandboxes();
    });
  }

  function openCreate(templateId) {
    var sel = $("cTemplate");
    sel.replaceChildren();
    state.catalog.forEach(function (t) {
      var o = document.createElement("option");
      o.value = t.id;
      o.textContent = t.title ? t.title + " (" + t.id + ")" : t.id;
      sel.appendChild(o);
    });
    if (templateId) sel.value = templateId;
    $("cName").value = "";
    $("cTTL").value = "";
    $("createDialog").showModal();
  }

  function submitCreate() {
    var body = { template: $("cTemplate").value };
    if ($("cName").value.trim()) body.name = $("cName").value.trim();
    if ($("cTTL").value.trim()) body.ttl = $("cTTL").value.trim();
    api("/sandboxes", { method: "POST", body: body })
      .then(function (sb) { toast("Created " + sb.id); return refresh(); })
      .catch(function (err) { toast("Could not create: " + err.message, true); });
  }

  function removeSandbox(id) {
    if (!confirm("Delete sandbox " + id + "? Everything in it goes with it.")) return;
    api("/sandboxes/" + encodeURIComponent(id), { method: "DELETE" })
      .then(function () { toast("Deleted " + id); return refresh(); })
      .catch(function (err) { toast("Could not delete: " + err.message, true); });
  }

  function renewSandbox(id) {
    var ttl = prompt("How long from now? (e.g. 2h; leave empty to remove the expiry)", "2h");
    if (ttl === null) return;
    api("/sandboxes/" + encodeURIComponent(id) + "/renew", { method: "POST", body: { ttl: ttl.trim() } })
      .then(function () { toast("Renewed " + id); return refresh(); })
      .catch(function (err) { toast("Could not renew: " + err.message, true); });
  }

  function showLogs(id) {
    $("logsTitle").textContent = "Logs — " + id;
    $("logsBody").textContent = "loading…";
    $("logsDialog").showModal();
    api("/sandboxes/" + encodeURIComponent(id) + "/logs?tail=300")
      .then(function (d) { $("logsBody").textContent = d.logs || "(no output yet)"; })
      .catch(function (err) { $("logsBody").textContent = "could not read logs: " + err.message; });
  }

  // ── users ─────────────────────────────────────────────────────────────────
  // ── wiring ────────────────────────────────────────────────────────────────

  $("createForm").addEventListener("submit", function (ev) {
    var button = ev.submitter;
    // The dialog is a form with method=dialog, so the default submit closes it.
    // "Create" is the one value that does more than close.
    if (button && button.value === "create") submitCreate();
  });

  $("signin-form").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var key = $("signin-key").value.trim();
    if (!key) { setSigninError("An API key is required."); return; }
    connect(key);
  });

  // The eye, on the field it belongs to.
  //
  // It flips the input between password and text and swaps its own icon to say
  // which way it is. An API key is a long string nobody can check while it is
  // dotted out, and the alternative — paste it into a text editor to see what
  // went wrong — puts it somewhere it should not be.
  var EYE_OPEN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>';
  var EYE_CLOSED = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/><line x1="4" y1="20" x2="20" y2="4"/></svg>';

  $("signin-reveal").onclick = function () {
    var field = $("signin-key");
    var wasShown = field.type === "text";
    field.type = wasShown ? "password" : "text";
    // The icon says what the next click does, not what the last one did.
    this.innerHTML = wasShown ? EYE_OPEN : EYE_CLOSED;
    this.setAttribute("aria-label", wasShown ? "Show the key" : "Hide the key");
    this.setAttribute("aria-pressed", String(!wasShown));
    field.focus();
  };
  // Drawn by the same code that toggles it, so the icon and the input's type
  // cannot start out disagreeing.
  (function () {
    var b = $("signin-reveal");
    b.innerHTML = EYE_OPEN;
    b.setAttribute("aria-label", "Show the key");
    b.setAttribute("aria-pressed", "false");
  })();

  $("signout").onclick = signOut;
  $("refresh").onclick = function () {
    refresh().catch(function (err) {
      // A key that stopped working — rotated, or the user deleted — ends the
      // session rather than leaving a console that fails every click.
      if (err.status === 401 || err.status === 403) {
        setSigninError("That key is no longer accepted.");
        signOut();
        return;
      }
      toast("Could not refresh: " + err.message, true);
    });
  };

  // Sign in from a key in the query string, which is how the link the API and
  // the CLI print works: a browser navigation cannot set a header, so `?key=`
  // is the only way the address can carry the credential. It is stripped from
  // the address bar afterwards — a key in a URL ends up in history, in a
  // screenshot and in whatever was pasted into chat.
  (function () {
    var fromURL = "";
    try { fromURL = new URLSearchParams(location.search).get("key") || ""; } catch (e) { /* no URLSearchParams */ }
    if (fromURL) {
      try {
        var u = new URL(location.href);
        u.searchParams.delete("key");
        history.replaceState(null, "", u.pathname + (u.searchParams.toString() ? "?" + u.searchParams : "") + u.hash);
      } catch (e) { /* the address bar keeps it; the session still works */ }
      connect(fromURL);
      return;
    }
    var saved = savedKey();
    if (saved) { connect(saved); return; }
    showSignedIn(false);
  })();

  // Refresh on an interval so a sandbox that expires disappears without a
  // click. Thirty seconds is the reaper's own period, so the page never lags
  // what the cluster shows by more than one sweep.
  setInterval(function () {
    if (state.key) refresh().catch(function () { /* a transient failure is not a sign-out */ });
  }, 30000);
})();
</script>
</body>
</html>
