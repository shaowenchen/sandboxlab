# A Python workspace, kept alive so work can be done in it rather than around
# it: the container runs no service and serves no port, and everything happens
# through `sandbox exec` and the file endpoints.
#
# `sleep infinity` is deliberate. Python's own default command reads stdin and
# exits when there is none, so the container would start and immediately finish
# — a sandbox that exists for a second. The image is otherwise unmodified, so
# what is installed here is exactly what `python:3.12-slim` is.
id: python
title: Python sandbox
description: >-
  A Python 3.12 workspace that stays up, for running scripts and installing
  packages with pip.
image: python:3.12-slim

command: ["sleep", "infinity"]

resources:
  cpu: "1"
  memory: 1Gi

ttlDefault: 30m
ttlMax: 4h
