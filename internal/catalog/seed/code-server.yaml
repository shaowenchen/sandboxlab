# VS Code in a browser: the environment to use when the work is editing rather
# than running. It serves its own HTML, so it needs a port and nothing else.
#
# `--auth none` is set because the deployment already authenticates: the console
# and every sandbox are behind the API key and the tunnel, and code-server's own
# password page would be a second login for no additional protection. Remove it
# if this template is ever served somewhere without that.
id: code-server
title: VS Code (browser)
description: >-
  A browser VS Code with a terminal and a filesystem, for reading and editing
  code in the sandbox.
image: codercom/code-server:latest

args: ["--auth", "none", "--disable-telemetry"]

ports:
  - name: vscode
    port: 8080
    description: The VS Code web interface

resources:
  cpu: "1"
  memory: 2Gi

ttlDefault: 1h
ttlMax: 8h
