# The sandboxlab control plane's HTTP API, as one document.
#
# This is the source of truth for the four ways in: the server's own routes, the
# web console, the `sandbox` CLI, and the generated SDK in ../sdk. The spec is
# hand-written and reviewed; the Go types are generated from it, which is what
# makes the SDK the owner of the domain model rather than a third copy of it.
#
# Two conventions run through it:
#
#   - A resource is returned bare (a Sandbox is the whole body of a create),
#     while a collection is wrapped with a count ({sandboxes, count}). The
#     wrapper is what leaves room to add a field to a list response later
#     without breaking a client that reads the array.
#   - Every failure is {"error": "..."} with a status the service chose: 400 for
#     a request that is wrong, 404 for one that names nothing, 409 for one that
#     conflicts with what exists, 429 for one that hit a ceiling.
openapi: 3.1.0

info:
  title: sandboxlab
  version: "1.0"
  description: >-
    Create disposable sandbox environments — a shell, a filesystem, a browser —
    on demand, in Kubernetes.

servers:
  - url: https://sandboxlab.example.com/sandbox
    description: >-
      A deployment behind a gateway. The base path is the deployment's own and
      is part of the address, not something a client appends.

# Both header styles are accepted on every authenticated route, and both are
# listed so a client can use whichever it has.
security:
  - ApiKey: []
  - BearerAuth: []

tags:
  - name: meta
    description: What this deployment is and what it can do. No key required.
  - name: sandboxes
    description: The environments themselves.

paths:
  /healthz:
    get:
      tags: [meta]
      operationId: health
      summary: Liveness
      description: >-
        Answers as long as the process is up. It does not check the cluster, so
        it is the wrong probe for "can this control plane do its job".
      security: []
      responses:
        "200":
          description: the process is up
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Status"}

  /readyz:
    get:
      tags: [meta]
      operationId: ready
      summary: Readiness
      description: >-
        Answers 200 when the control plane can reach a cluster and 503 when it
        cannot, which is the difference between "running" and "working".
      security: []
      responses:
        "200":
          description: the cluster is reachable
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Status"}
        "503":
          description: the cluster is not reachable
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}

  /api/v1/describe:
    get:
      tags: [meta]
      operationId: describe
      summary: This API's own contract
      description: >-
        The endpoints this deployment serves, with the credential each needs. It
        takes no key, which is what makes it the way to check an address before
        configuring one. It is generated from the same table the routes are, so
        it cannot omit a route.
      security: []
      responses:
        "200":
          description: the contract
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Describe"}

  /api/v1/config:
    get:
      tags: [meta]
      operationId: getConfig
      summary: The deployment's shape
      description: >-
        What this deployment is: the interface version, the lifetimes it
        enforces, the ceiling on how many sandboxes may exist, and where it is
        served. The console reads it on load to decide what to offer.
      security: []
      responses:
        "200":
          description: the deployment's configuration
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Config"}

  /api/v1/catalog:
    get:
      tags: [sandboxes]
      operationId: listCatalog
      summary: The templates a sandbox can be created from
      responses:
        "200":
          description: every template
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TemplateList"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /api/v1/catalog/{id}:
    get:
      tags: [sandboxes]
      operationId: getCatalogEntry
      summary: One template
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: the template
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Template"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/overview:
    get:
      tags: [sandboxes]
      operationId: getOverview
      summary: Counts of sandboxes by state and template
      description: >-
        What is running and what it is: how many sandboxes exist, and how they
        break down by state and template.
      responses:
        "200":
          description: the summary
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Overview"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /api/v1/sandboxes:
    get:
      tags: [sandboxes]
      operationId: listSandboxes
      summary: Every sandbox in the deployment
      responses:
        "200":
          description: the sandboxes
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SandboxList"}
        "401": {$ref: "#/components/responses/Unauthorized"}
    post:
      tags: [sandboxes]
      operationId: createSandbox
      summary: Create one
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateSandboxRequest"}
      responses:
        "201":
          description: the sandbox, which is Pending until its container is up
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Sandbox"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "409": {$ref: "#/components/responses/Conflict"}
        "429": {$ref: "#/components/responses/LimitReached"}

  /api/v1/sandboxes/{id}:
    get:
      tags: [sandboxes]
      operationId: getSandbox
      summary: One sandbox
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: the sandbox
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Sandbox"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      tags: [sandboxes]
      operationId: deleteSandbox
      summary: Delete one
      description: >-
        Everything in it goes too. A sandbox is a namespace, so this is one
        operation rather than a list of objects to get right.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: it was deleted
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted:
                    type: string
                    description: the id that was deleted
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/sandboxes/{id}/renew:
    post:
      tags: [sandboxes]
      operationId: renewSandbox
      summary: Reset a sandbox's lifetime, measured from now
      description: >-
        A ttl of "0" removes the expiry entirely, which is how a sandbox someone
        is working in is kept from disappearing.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RenewSandboxRequest"}
      responses:
        "200":
          description: the sandbox, with its new expiry
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Sandbox"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/sandboxes/{id}/logs:
    get:
      tags: [sandboxes]
      operationId: getSandboxLogs
      summary: The tail of a sandbox's output
      description: >-
        A sandbox whose container is still being created answers 409: there is
        nothing to read yet, which is the ordinary state moments after a create
        rather than a failure.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
        - name: tail
          in: query
          required: false
          description: how many lines to return; 200 when omitted
          schema: {type: integer}
      responses:
        "200":
          description: the output
          content:
            application/json:
              schema:
                type: object
                required: [logs]
                properties:
                  logs: {type: string}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}

  /api/v1/sandboxes/{id}/exec:
    post:
      tags: [sandboxes]
      operationId: execInSandbox
      summary: Run a command in a sandbox and wait for it
      description: >-
        The command is an argv, not a command line: pass ["sh", "-c", "..."] to
        have a shell interpret it, and pass anything else to have it not. This
        is the way into a sandbox whose template serves no port — python and
        node are a workspace with no URL, and this is what reaches them.


        **A non-zero exitCode is not a failure.** The command ran and that is
        what it returned, so the response is a 200 carrying the output and the
        status. Only an error response means the command could not be run at
        all — no pod yet, no permission, or the timeout below.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ExecRequest"}
      responses:
        "200":
          description: the command's output and its exit status
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ExecResult"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "504": {$ref: "#/components/responses/Timeout"}

  /api/v1/sandboxes/{id}/files:
    get:
      tags: [sandboxes]
      operationId: readSandboxFile
      summary: Read a file out of a sandbox
      description: >-
        content is the file's bytes: UTF-8 verbatim when the file is text, and
        base64 when it is not. encoding says which, so a caller reads a field
        rather than sniffing the content. A file over the deployment's limit is
        413 rather than a truncated read.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
        - name: path
          in: query
          required: true
          description: an absolute path inside the sandbox
          schema: {type: string}
      responses:
        "200":
          description: the file
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FileContent"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "413": {$ref: "#/components/responses/TooLarge"}
    put:
      tags: [sandboxes]
      operationId: writeSandboxFile
      summary: Write a file into a sandbox
      description: >-
        It creates the file if it is absent and replaces it if it is. Parent
        directories are not created unless createParents is set: a silently
        created directory turns a mistyped path into a file nobody will find,
        where a refusal names the directory that is missing.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
        - name: path
          in: query
          required: true
          description: an absolute path inside the sandbox
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WriteFileRequest"}
      responses:
        "200":
          description: where it was written, and how much
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FileInfo"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "413": {$ref: "#/components/responses/TooLarge"}

  /sandbox/{id}/{port}/:
    get:
      tags: [sandboxes]
      operationId: proxyToSandbox
      summary: Proxy to a sandbox's own port
      description: >-
        The data plane: everything under this prefix is forwarded to the
        sandbox's container. What comes back is whatever the sandbox serves —
        HTML, JSON, a file — so it is not a typed endpoint and the SDK exposes
        the address rather than a method. A browser navigation cannot set a
        header, which is why the key is also accepted in the query string.
      security:
        - ApiKeyQuery: []
        - ApiKey: []
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
        - name: port
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: whatever the sandbox served
          content:
            "*/*":
              schema: {type: string, format: binary}
        "404": {$ref: "#/components/responses/NotFound"}
        "502":
          description: the sandbox could not be reached

components:
  securitySchemes:
    # The deployment's key. Both headers carry the same
    # credential; a client sends whichever it has.
    ApiKey:
      type: apiKey
      in: header
      name: X-Sandbox-Key
    BearerAuth:
      type: http
      scheme: bearer
    # Only the data plane takes this, because only the data plane is reached by
    # a navigation rather than by a client that can set a header.
    ApiKeyQuery:
      type: apiKey
      in: query
      name: key

  responses:
    BadRequest:
      description: the request was not usable
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Unauthorized:
      description: no key, or not a key this deployment issued
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Forbidden:
      description: a valid key that may not do this
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    NotFound:
      description: no such object
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Conflict:
      description: the request conflicts with what exists
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    LimitReached:
      description: the caller, or the deployment, is at its ceiling
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    TooLarge:
      description: the file or the request body is larger than this API carries
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Timeout:
      description: >-
        nothing is broken — the command was still running when its time ran
        out, and it can be asked for again with a longer one
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: what went wrong, in a sentence meant for the person who made the request

    Status:
      type: object
      description: A liveness or readiness answer. Both routes are unauthenticated, so a probe needs no key.
      required: [status]
      properties:
        status: {type: string, examples: ["ok"]}

    # ── the deployment ──────────────────────────────────────────────────────

    Config:
      type: object
      required: [apiVersion, build, basePath, namespace, dataPlane, defaultTTL, maxTTL, maxSandboxes, templates]
      properties:
        apiVersion: {type: string, description: "the interface version, not the build's"}
        build:      {type: string}
        basePath:   {type: string, description: "the path prefix this deployment is served under"}
        publicURL:  {type: string, description: "the address sandboxes are reported at; empty means relative addresses"}
        namespace:  {type: string, description: "the namespace the control plane runs in"}
        dataPlane:  {type: boolean, description: "whether sandboxes can be proxied to"}
        defaultTTL: {type: string, description: "a duration, e.g. 1h0m0s"}
        maxTTL:     {type: string, description: "a duration, e.g. 8h0m0s"}
        maxSandboxes: {type: integer, description: "0 means no deployment-wide ceiling"}
        templates:  {type: integer, description: "how many templates the catalog holds"}

    Describe:
      type: object
      required: [name, version, build, basePath, auth, endpoints]
      properties:
        name:     {type: string}
        version:  {type: string}
        build:    {type: string}
        basePath: {type: string}
        auth:     {$ref: "#/components/schemas/AuthDescription"}
        endpoints:
          type: array
          items: {$ref: "#/components/schemas/EndpointDescription"}

    AuthDescription:
      type: object
      properties:
        scheme:  {type: string, description: "how a key is presented: `key`"}
        headers: {type: array, items: {type: string}, description: "the headers a key may be sent in"}

    EndpointDescription:
      type: object
      required: [method, path, description]
      properties:
        method:      {type: string}
        path:        {type: string}
        description: {type: string}

    # ── the catalog ───────────────────────────────────────────────────────────
    #
    # A template is read from YAML on disk as well as from JSON over the wire, so
    # every field carries a yaml tag as well as its json one. Without it the
    # loader would look for `ttldefault` and silently drop every template's
    # lifetime — the kind of failure that shows up as a default that is not
    # applied rather than as an error.
    Template:
      type: object
      required: [id, title, image]
      properties:
        id:
          type: string
          description: the stable identifier a create names
          x-oapi-codegen-extra-tags: {yaml: "id"}
        title:
          type: string
          x-oapi-codegen-extra-tags: {yaml: "title"}
        description:
          type: string
          x-oapi-codegen-extra-tags: {yaml: "description,omitempty"}
        image:
          type: string
          x-oapi-codegen-extra-tags: {yaml: "image"}
        ports:
          type: array
          items: {$ref: "#/components/schemas/Port"}
          x-oapi-codegen-extra-tags: {yaml: "ports,omitempty"}
        env:
          type: object
          additionalProperties: {type: string}
          description: environment the template sets, merged under the caller's own
          x-oapi-codegen-extra-tags: {yaml: "env,omitempty"}
        command:
          type: array
          items: {type: string}
          x-oapi-codegen-extra-tags: {yaml: "command,omitempty"}
        args:
          type: array
          items: {type: string}
          x-oapi-codegen-extra-tags: {yaml: "args,omitempty"}
        resources:
          allOf: [{$ref: "#/components/schemas/Resources"}]
          x-oapi-codegen-extra-tags: {yaml: "resources,omitempty"}
        ttlDefault:
          type: string
          description: the lifetime a create gets when it asks for none
          x-oapi-codegen-extra-tags: {yaml: "ttlDefault,omitempty"}
        ttlMax:
          type: string
          description: the ceiling a caller cannot exceed
          x-oapi-codegen-extra-tags: {yaml: "ttlMax,omitempty"}
        persistent:
          type: boolean
          x-oapi-codegen-extra-tags: {yaml: "persistent,omitempty"}
        workDir:
          type: string
          x-oapi-codegen-extra-tags: {yaml: "workDir,omitempty"}

    Port:
      type: object
      required: [name, port]
      properties:
        name:
          type: string
          description: identifies the port, and is the segment a data-plane URL may carry
          x-oapi-codegen-extra-tags: {yaml: "name"}
        port:
          type: integer
          format: int32
          x-oapi-codegen-extra-tags: {yaml: "port"}
        protocol:
          type: string
          description: TCP or UDP; empty means TCP
          x-oapi-codegen-extra-tags: {yaml: "protocol,omitempty"}
        description:
          type: string
          x-oapi-codegen-extra-tags: {yaml: "description,omitempty"}

    Resources:
      type: object
      properties:
        cpu:
          type: string
          description: a Kubernetes quantity, e.g. "500m" or "2"
          x-oapi-codegen-extra-tags: {yaml: "cpu,omitempty"}
        memory:
          type: string
          description: a Kubernetes quantity, e.g. "1Gi"
          x-oapi-codegen-extra-tags: {yaml: "memory,omitempty"}

    TemplateList:
      type: object
      description: The catalog — what a sandbox can be created from.
      required: [templates]
      properties:
        templates: {type: array, items: {$ref: "#/components/schemas/Template"}}

    # ── sandboxes ─────────────────────────────────────────────────────────────

    SandboxState:
      type: string
      enum: [Pending, Running, Failed, Expired]
      x-enum-varnames: [StatePending, StateRunning, StateFailed, StateExpired]

    Sandbox:
      type: object
      required: [id, template, image, state, createdAt]
      properties:
        id:
          type: string
          description: both the name and the identity; it is a namespace name
        template: {type: string, description: "the catalog id this was created from"}
        image:    {type: string}
        state:    {$ref: "#/components/schemas/SandboxState"}
        message:
          type: string
          description: why the state is not Running, when the cluster says
        createdAt: {type: string, format: date-time}
        expiresAt:
          type: string
          format: date-time
          description: >-
            absent when the sandbox has no TTL, which is a real state rather
            than a zero time — a client that shows "no expiry" keys off its
            absence
          x-go-type: "*time.Time"
        endpoints:
          type: array
          items: {$ref: "#/components/schemas/Endpoint"}
        env:
          type: object
          additionalProperties: {type: string}
          description: the non-secret environment the sandbox was created with
        namespace: {type: string, description: "the namespace the sandbox owns"}

    Endpoint:
      type: object
      required: [name, port]
      properties:
        name: {type: string, description: "the port name it serves"}
        port: {type: integer, format: int32}
        url:
          type: string
          description: the address to open; absent when the deployment has no public URL

    SandboxList:
      type: object
      description: |
        Every sandbox in the deployment, and how many that is.

        Counted as well as listed because the two are not always the same
        question: a console renders the list, and a script that only wants to
        know whether anything is running should not have to read one.
      required: [sandboxes, count]
      properties:
        sandboxes: {type: array, items: {$ref: "#/components/schemas/Sandbox"}}
        count:     {type: integer}

    CreateSandboxRequest:
      type: object
      required: [template]
      properties:
        template: {type: string, description: "the catalog id to create from"}
        name:
          type: string
          description: >-
            the sandbox's name; generated when empty. Lowercase alphanumerics
            and '-', up to 40 characters, because it becomes a namespace.
        ttl: {type: string, description: "how long it may live, e.g. 90m; the template's default when empty"}
        env:
          type: object
          additionalProperties: {type: string}
          description: environment overrides, merged over the template's own

    ExecRequest:
      type: object
      required: [command]
      properties:
        command:
          type: array
          minItems: 1
          items: {type: string}
          description: >-
            the command and its arguments, as separate values. Pass
            ["sh", "-c", "..."] to have a shell interpret a command line;
            anything else is executed directly.
        stdin:
          type: string
          description: input for the command, decoded per encoding
        cwd:
          type: string
          description: >-
            the working directory; the image's own when omitted
        timeout:
          type: string
          description: >-
            how long the command may take, e.g. "30s". Clamped to the
            deployment's own ceiling however large it is.
        encoding:
          type: string
          enum: [utf8, base64]
          description: how stdin is spelled; utf8 is the default

    ExecResult:
      type: object
      required: [exitCode, stdout, stderr, stdoutEncoding, stderrEncoding]
      properties:
        exitCode:
          type: integer
          description: >-
            the command's exit status. A non-zero value is not a failure of
            this request: the command ran. Only an error response means it
            could not be run.
        stdout: {type: string}
        stderr: {type: string}
        stdoutEncoding:
          type: string
          enum: [utf8, base64]
          description: >-
            how stdout is spelled: utf8 for text, base64 for anything that is
            not valid UTF-8. Chosen per stream, so a command that printed text
            to one and bytes to the other is spelled correctly in both.
        stderrEncoding:
          type: string
          enum: [utf8, base64]
        stdoutTruncated:
          type: boolean
          description: the output hit the deployment's cap and was cut off
        stderrTruncated:
          type: boolean

    FileContent:
      type: object
      required: [path, content, encoding, size]
      properties:
        path: {type: string}
        content:
          type: string
          description: the file's bytes, decoded per encoding
        encoding:
          type: string
          enum: [utf8, base64]
          description: >-
            utf8 when the file is valid UTF-8 text, base64 when it is not —
            a caller reads this rather than guessing from the content
        size:
          type: integer
          description: the length of the file's bytes, before encoding

    WriteFileRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          description: the file's bytes, decoded per encoding
        encoding:
          type: string
          enum: [utf8, base64]
          description: how content is spelled; utf8 is the default
        createParents:
          type: boolean
          description: >-
            create the directories above the path when they are missing.
            Off by default, so a mistyped directory is a 400 naming it rather
            than a file written somewhere unexpected.

    FileInfo:
      type: object
      required: [path, size]
      properties:
        path: {type: string}
        size: {type: integer, description: "how many bytes were written"}

    RenewSandboxRequest:
      type: object
      required: [ttl]
      properties:
        ttl:
          type: string
          description: >-
            the new lifetime, e.g. 2h. "0" removes the expiry entirely rather
            than setting a zero one.

    Overview:
      type: object
      required: [total, byState, byTemplate, cluster, scoped]
      properties:
        total:      {type: integer}
        byState:    {type: object, additionalProperties: {type: integer}}
        byTemplate: {type: object, additionalProperties: {type: integer}}
        byOwner:    {type: object, additionalProperties: {type: integer}}
        cluster:    {type: boolean, description: "whether the cluster is reachable"}
        maxSandboxes: {type: integer, description: "the deployment's ceiling; 0 means none"}
    Deleted:
      type: object
      required: [deleted]
      properties:
        deleted: {type: string, description: "the id that was deleted"}
